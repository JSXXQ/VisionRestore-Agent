[project]
name = "visionrestore-agent"
version = "0.1.0"
description = "Local multi-model low-light RGB image enhancement agent"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pillow>=10.0",
  "sqlalchemy>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
torch = ["torch>=2.3"]
opencv = ["opencv-python-headless>=4.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
addopts = "-q"
[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["visionrestore*"]
