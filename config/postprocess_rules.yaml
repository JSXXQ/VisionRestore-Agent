residual_degradation:
  denoise:
    noise_increase_min: 4
    noise_after_min: 12
    color_noise_cast_min: 0.18
    darkir_extra_threshold: 1.35
    confidence_high: 0.75
  super_resolution:
    short_edge_threshold: 900
    high_resolution_short_edge: 1600
    detail_recovery_max: 0.55
    detail_short_edge_max: 1400
    default_scale: 2
    max_default_scale: 2
    max_output_pixels: 50000000
    allow_automatic_x4: false
    require_confirmation: true
    preferred_model: "realesrgan"
    default_checkpoint: "realesrgan_x2plus"
  blur:
    sharpness_after_min: 60
  overprocess:
    structure_min: 0.45
